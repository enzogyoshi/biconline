<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat">
    <div class="topo">Chat luisão cara de mau comedor de pastel <span id="status">conectando...</span></div>
    <div class="mensagens" id="mensagens"></div>
    <form class="envio" id="form">
      <input id="texto" placeholder="Digite uma mensagem..." autocomplete="off">
      <button>Enviar</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
